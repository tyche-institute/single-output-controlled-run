# Controlled release run: a copy of the release workflow of slsa-verifier.
#
# Derived from .github/workflows/release.yml of slsa-framework/slsa-verifier at commit
# ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 (Apache License 2.0, Copyright SLSA Authors).
# This file was changed. PROTOCOL.md, Section 3, lists every change. The three jobs below
# (args, builder, verification) are, byte for byte, lines 22 to 90 of the source, except that
# this second form adds the job plant and names it in the needs of the job verification.
name: Controlled release run

on:
  push:
    tags:
      - "*" # triggers only if push new tag version, like `0.8.4`.

permissions: read-all

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Generate ldflags dynamically.
  args:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ldflags.outputs.version }}
    steps:
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: ldflags
        run: |
          echo "version=$(git describe --tags --always --dirty | cut -c2-)" >> "$GITHUB_OUTPUT"

  builder:
    name: builder-${{matrix.os}}-${{matrix.arch}}
    needs: [args]
    strategy:
      matrix:
        os:
          - linux
          - windows
          - darwin
        arch:
          - amd64
          - arm64
    permissions:
      actions: read # For the detection of GitHub Actions environment.
      id-token: write # For signing.
      contents: write # For asset uploads.
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.0.0 # always use a tag @X.Y.Z for for slsa builders, not SHA!
    with:
      go-version-file: "go.mod"
      config-file: .slsa-goreleaser/${{matrix.os}}-${{matrix.arch}}.yml
      compile-builder: true
      evaluated-envs: "VERSION:${{needs.args.outputs.version}}"

  # Not in the source: the planted fault of the second controlled run (PROTOCOL.md, Section 5).
  # It reads the completion times of this run's jobs. It never reads the builder's output.
  plant:
    needs: [builder]
    runs-on: ubuntu-latest
    permissions:
      actions: read # To read this run's jobs and their completion times.
      contents: write # To replace one release asset.
    steps:
      - name: Replace the binary of the leg that completed first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          jobs_url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          release_url="repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"

          # Every job of the six legs, with its completion time. The listing can lag by a few
          # seconds, so wait until all 42 jobs are listed as completed.
          try=0
          while true; do
            try=$((try + 1))
            gh api --paginate "$jobs_url" \
              --jq '.jobs[] | select(.name | startswith("builder-")) | [.name, .status, (.conclusion // "none"), (.completed_at // "none")] | @tsv' > jobs.tsv
            total="$(grep -c . jobs.tsv || true)"
            open="$(awk -F '\t' '$2 != "completed" || $4 == "none"' jobs.tsv | grep -c . || true)"
            echo "PLANT listing try=$try jobs=$total not_completed=$open"
            if [ "$total" -eq 42 ] && [ "$open" -eq 0 ]; then
              break
            fi
            if [ "$try" -ge 24 ]; then
              echo "PLANT stop: the job listing is not complete"
              exit 1
            fi
            sleep 5
          done

          # One line per leg: its completion time (the latest among its jobs), its place in the
          # matrix, and its name. Every job of every leg must have succeeded.
          : > legs.tsv
          place=0
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              place=$((place + 1))
              awk -F '\t' -v p="builder-$os-$arch / " 'index($1, p) == 1' jobs.tsv > leg.tsv
              count="$(grep -c . leg.tsv || true)"
              bad="$(awk -F '\t' '$3 != "success"' leg.tsv | grep -c . || true)"
              if [ "$count" -ne 7 ] || [ "$bad" -ne 0 ]; then
                echo "PLANT stop: leg $os-$arch has $count jobs, $bad of them without success"
                exit 1
              fi
              done_at="$(cut -f 4 leg.tsv | sort | tail -n 1)"
              printf '%s\t%s\t%s\t%s\n' "$done_at" "$place" "$os" "$arch" >> legs.tsv
            done
          done
          sort -t "$(printf '\t')" -k 1,1 -k 2,2n legs.tsv > order.tsv
          echo "PLANT legs by completion time (time, place in the matrix, os, arch):"
          cat order.tsv

          # The leg that completed first; among legs of the same second, the earlier in the matrix.
          first_done="$(head -n 1 order.tsv | cut -f 1)"
          os="$(head -n 1 order.tsv | cut -f 3)"
          arch="$(head -n 1 order.tsv | cut -f 4)"
          name="sample-$os-$arch"
          if [ "$os" = "windows" ]; then
            name="$name.exe"
          fi

          echo "PLANT release assets before (name, size, digest, updated):"
          gh api "$release_url" --jq '.assets[] | [.name, .size, (.digest // "none"), .updated_at] | @tsv'

          # The binary as the builder uploaded it.
          mkdir built
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$name" -D built
          built_sha="$(sha256sum "built/$name" | cut -d ' ' -f 1)"

          # The marker that takes its place. Its text is fixed, so its digest is known beforehand.
          mkdir marker
          printf '%s\n' \
            'PLANTED FILE of a controlled release run. It replaces a release binary on purpose.' \
            'It is not a program. See PROTOCOL.md in this repository.' > "marker/$name"
          marker_sha="$(sha256sum "marker/$name" | cut -d ' ' -f 1)"

          gh -R "$GITHUB_REPOSITORY" release upload "$GITHUB_REF_NAME" "marker/$name" --clobber

          echo "PLANT release assets after (name, size, digest, updated):"
          gh api "$release_url" --jq '.assets[] | [.name, .size, (.digest // "none"), .updated_at] | @tsv'

          # Read the asset back and compare it with the marker.
          mkdir back
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$name" -D back
          back_sha="$(sha256sum "back/$name" | cut -d ' ' -f 1)"
          echo "PLANT leg=$os-$arch asset=$name first_done=$first_done built_sha256=$built_sha marker_sha256=$marker_sha read_back_sha256=$back_sha"
          test "$marker_sha" = "$back_sha"
          test "$marker_sha" != "$built_sha"

  verification:
    needs: [builder, plant]
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    permissions: read-all
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647 # v2.6.0

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATT_FILE_NAME: "${{ needs.builder.outputs.go-binary-name }}.intoto.jsonl"
          ARTIFACT: ${{ needs.builder.outputs.go-binary-name }}
        run: |
          set -euo pipefail

          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p $ARTIFACT
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$ATT_FILE_NAME"

      - name: Verify assets
        env:
          ARTIFACT: ${{ needs.builder.outputs.go-binary-name }}
          ATT_FILE_NAME: "${{ needs.builder.outputs.go-binary-name }}.intoto.jsonl"
        run: |
          set -euo pipefail

          echo "Verifying $ARTIFACT using $ATT_FILE_NAME"
          slsa-verifier verify-artifact --provenance-path "$ATT_FILE_NAME" \
                                        --source-uri "github.com/$GITHUB_REPOSITORY" \
                                        --source-tag "$GITHUB_REF_NAME" \
                                        "$ARTIFACT"
