# Not in the source: the tool check of the controlled runs (PROTOCOL.md, Section 4).
#
# It runs the installer step of the verification job of release.yml, which comes from
# .github/workflows/release.yml of slsa-framework/slsa-verifier at commit
# ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 (Apache License 2.0, Copyright SLSA Authors),
# and prints the version of the installed verifier. It builds and verifies nothing.
name: Tool check

on:
  workflow_dispatch:

permissions: read-all

jobs:
  toolcheck:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647 # v2.6.0

      - name: Print the version of the verifier
        run: |
          set -euo pipefail

          slsa-verifier version
